name: Mise à jour planning coloc
on:
  schedule:
    - cron: "0 */3 * * *"   # toutes les 3 heures
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Générer la page depuis les liens iCal
        env:
          ICAL_PIERRE: ${{ secrets.ICAL_PIERRE }}
          ICAL_THEO: ${{ secrets.ICAL_THEO }}
          ICAL_JEANNE: ${{ secrets.ICAL_JEANNE }}
        run: python generate_coloc.py
      - name: Publier
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add index.html donnees_coloc.json
          git commit -m "maj planning coloc" --allow-empty
          git push
